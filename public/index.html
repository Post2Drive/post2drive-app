<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#102a43" />
    <title>Post2Drive</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; color: #172b4d; background: #f4f7fa; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: 100%; max-width: 420px; border: 1px solid #d9e2ec; border-radius: 16px; padding: 28px; background: #fff; box-shadow: 0 8px 28px rgba(16,42,67,.08); }
      h1 { margin: 0 0 12px; color: #102a43; font-size: 25px; }
      p { line-height: 1.55; }
      a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 8px; padding: 10px 16px; border-radius: 8px; color: white; background: #1976d2; font-weight: 700; text-decoration: none; }
      .muted { color: #6b7c93; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Post2Drive</h1>
      <p>This build is not connected to a deployed Post2Drive service yet.</p>
      <p class="muted">For mobile builds, configure <code>CAPACITOR_SERVER_URL</code> with the intended HTTPS deployment URL. No old production endpoint is embedded in this build.</p>
    </main>
  </body>
</html>
