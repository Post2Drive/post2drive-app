// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Capacitor/Cordova transitive dependencies can pin Kotlin's split JDK
    // stdlib artifacts to 1.6.21 while the graph also contains stdlib 1.8.22.
    // Align the legacy bridge artifacts to the resolved Kotlin stdlib version.
    configurations.configureEach {
        resolutionStrategy.force(
            'org.jetbrains.kotlin:kotlin-stdlib:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22',
            'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        )
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
