name: Build Android tester APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS URL of the specific non-production Post2Drive deployment to load in this APK"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build configured Android QA APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate configured target
        run: |
          # Exact allow-list (issue #38): a "contains staging" test let lookalikes through.
          # Keep in sync with APPROVED_STAGING_ORIGINS in lib/qaRunnerGuard.ts.
          node -e 'const approved = ["https://post2drive-web-staging.up.railway.app"]; let u; try { u = new URL(process.env.CAPACITOR_SERVER_URL); } catch { console.error("Not a valid URL."); process.exit(1); } const ok = u.protocol === "https:" && !u.username && !u.password && u.port === "" && (u.pathname === "/" || u.pathname === "") && !u.search && !u.hash && approved.includes(u.origin.toLowerCase()); if (!ok) { console.error("Target must be an approved Post2Drive staging origin: " + approved.join(", ")); process.exit(1); } console.log(`Building for ${u.origin}`);'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Upload QA APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post2drive-android-qa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
