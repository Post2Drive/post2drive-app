name: Build signed Android release (Google Play)

# Manual only. Produces a signed .aab for upload to the Play Console.
# Needs repository secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See docs/STORE_READINESS.md.
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "HTTPS origin of the PRODUCTION Post2Drive site this release loads (never staging)"
        required: true
        type: string
      version_code:
        description: "Play version code: a whole number higher than every earlier upload"
        required: true
        type: string
      version_name:
        description: "Version shown to users, e.g. 1.0.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build-release-bundle:
    name: Build signed release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url }}
      P2D_VERSION_CODE: ${{ inputs.version_code }}
      P2D_VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release inputs
        run: |
          node -e 'const staging = ["post2drive-web-staging.up.railway.app"]; let u; try { u = new URL(process.env.CAPACITOR_SERVER_URL); } catch { console.error("server_url is not a valid URL."); process.exit(1); } const clean = u.protocol === "https:" && !u.username && !u.password && u.port === "" && (u.pathname === "/" || u.pathname === "") && !u.search && !u.hash; const host = u.hostname.toLowerCase(); const test = staging.includes(host) || /(^|[.-])(staging|test|dev|qa|preview|localhost)([.-]|$)/.test(host) || host.endsWith(".up.railway.app"); if (!clean || test) { console.error("server_url must be the bare https origin of the production site, not a staging, test or platform-default address."); process.exit(1); } if (!/^[1-9][0-9]{0,8}$/.test(process.env.P2D_VERSION_CODE)) { console.error("version_code must be a positive whole number."); process.exit(1); } if (!/^[0-9]+\.[0-9]+(\.[0-9]+)?$/.test(process.env.P2D_VERSION_NAME)) { console.error("version_name must look like 1.0 or 1.0.0."); process.exit(1); } console.log(`Release ${process.env.P2D_VERSION_NAME} (${process.env.P2D_VERSION_CODE}) for ${u.origin}`);'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Sync Capacitor Android project
        run: npx cap sync android
      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "Secret ANDROID_KEYSTORE_BASE64 is not set."; exit 1; fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      - name: Build signed release bundle
        working-directory: android
        env:
          P2D_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P2D_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P2D_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export P2D_RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon bundleRelease
      - name: Confirm the bundle is signed
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tee /tmp/verify.txt
          grep -q "jar verified" /tmp/verify.txt
      - name: Remove keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: post2drive-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
