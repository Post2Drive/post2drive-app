name: CodeQL

on:
  pull_request:
    branches: [main, "audit/**", "integration/**"]
  push:
    branches: [main, "feature/**", "security/**", "audit/**", "integration/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

# A newer commit supersedes CodeQL analysis of an older revision in the same PR.
# Keep the full scan, but avoid queueing stale analyses behind the current head.
concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      - name: Preserve CodeQL SARIF for security review
        if: always()
        run: |
          mkdir -p .codeql-artifacts
          if [ -f ../results/javascript.sarif ]; then
            cp ../results/javascript.sarif .codeql-artifacts/javascript.sarif
          else
            echo "CodeQL SARIF file was not produced; no artifact to preserve."
          fi
      - name: Upload CodeQL SARIF artifact
        if: always() && hashFiles('.codeql-artifacts/javascript.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif-${{ github.sha }}
          path: .codeql-artifacts/javascript.sarif
          retention-days: 3

