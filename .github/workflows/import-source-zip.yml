name: Import verified Post2Drive source ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify the uploaded source archive
        shell: bash
        run: |
          set -euo pipefail
          archive="post2drive-clean-start.zip"
          test -f "$archive" || { echo "Upload post2drive-clean-start.zip to the repository root first."; exit 1; }
          echo "19c34528045b717ef5f6e7546f028a884ece41414073ac13c22b51d6b88a91fc  $archive" | sha256sum --check -
          unzip -t "$archive"
          mkdir -p "$RUNNER_TEMP/post2drive-source"
          unzip -q "$archive" -d "$RUNNER_TEMP/post2drive-source"
          source="$RUNNER_TEMP/post2drive-source/freight-app-main"
          test -f "$source/package.json"
          test -f "$source/app/page.tsx"
          test -f "$source/app/api/signup/route.ts"
          test -f "$source/app/api/jobs/[id]/cancel/route.ts"
          test -f "$source/prisma/schema.prisma"
          if find "$source" -type f \( -name '.env' -o -name '.env.local' -o -name '*.jks' -o -name '*.keystore' -o -name '*.apk' -o -name '*.aab' \) -print -quit | grep -q .; then
            echo "Refusing to import a source archive containing secrets or local signing/build artifacts."
            exit 1
          fi

      - name: Replace partial manual upload with the verified source baseline
        shell: bash
        run: |
          set -euo pipefail
          source="$RUNNER_TEMP/post2drive-source/freight-app-main"
          rm -f post2drive-clean-start.zip
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/import-source-zip.yml' "$source/" "$GITHUB_WORKSPACE/"
          git add -A
          if git diff --cached --quiet; then
            echo "Repository already matches the source archive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: import verified Post2Drive source baseline"
          git push origin HEAD:main
